<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a5a8c"/>
      <stop offset="1" stop-color="#16233d"/>
    </linearGradient>
    <radialGradient id="lampLit" cx="0.38" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#9fffc0"/>
      <stop offset="0.55" stop-color="#35d05a"/>
      <stop offset="1" stop-color="#1d9e3c"/>
    </radialGradient>
    <radialGradient id="lampDim" cx="0.4" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#4a5878"/>
      <stop offset="1" stop-color="#2b3550"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a3"/>
      <stop offset="0.45" stop-color="#ffb340"/>
      <stop offset="1" stop-color="#ff5f2e" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a76ab"/>
      <stop offset="1" stop-color="#33466e"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="229" fill="url(#bg)"/>

  <path d="M368 660 L196 900 L368 856 Z" fill="url(#fin)"/>
  <path d="M656 660 L828 900 L656 856 Z" fill="url(#fin)"/>

  <rect x="362" y="170" width="300" height="590" rx="150" fill="#22304f"/>
  <rect x="362" y="170" width="300" height="590" rx="150" fill="none" stroke="#4a5f8f" stroke-width="6"/>

  <!-- only the green (bottom) lamp is lit -->
  <circle cx="512" cy="300" r="86" fill="url(#lampDim)"/>
  <circle cx="512" cy="512" r="86" fill="url(#lampDim)"/>
  <circle cx="512" cy="724" r="86" fill="url(#lampLit)"/>

  <circle cx="482" cy="696" r="22" fill="#ffffff" opacity="0.35"/>

  <path d="M468 748 L556 748 L576 806 L448 806 Z" fill="#8899bb"/>
  <path d="M512 800 C606 858 634 934 512 986 C390 934 418 858 512 800 Z" fill="url(#flame)"/>
  <path d="M512 848 C566 890 582 936 512 962 C442 936 458 890 512 848 Z" fill="#fff7cc" opacity="0.85"/>
