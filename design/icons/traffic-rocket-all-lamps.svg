<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a5a8c"/>
      <stop offset="1" stop-color="#16233d"/>
    </linearGradient>
    <radialGradient id="lampRed" cx="0.38" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#ff8a80"/>
      <stop offset="0.55" stop-color="#ff5f57"/>
      <stop offset="1" stop-color="#d63a30"/>
    </radialGradient>
    <radialGradient id="lampAmber" cx="0.38" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.55" stop-color="#febc2e"/>
      <stop offset="1" stop-color="#e09b12"/>
    </radialGradient>
    <radialGradient id="lampGreen" cx="0.38" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#7ce89a"/>
      <stop offset="0.55" stop-color="#28c840"/>
      <stop offset="1" stop-color="#1a9c30"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a3"/>
      <stop offset="0.45" stop-color="#ffb340"/>
      <stop offset="1" stop-color="#ff5f2e" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a76ab"/>
      <stop offset="1" stop-color="#33466e"/>
    </linearGradient>
  </defs>

  <!-- background squircle -->
  <rect width="1024" height="1024" rx="229" fill="url(#bg)"/>

  <!-- fins -->
  <path d="M368 610 C300 700 240 800 196 902 L368 850 Z" fill="url(#fin)"/>
  <path d="M656 610 C724 700 784 800 828 902 L656 850 Z" fill="url(#fin)"/>

  <!-- traffic-light housing = rocket body (less capsule, lamps fit inside) -->
  <rect x="352" y="130" width="320" height="660" rx="120" fill="#22304f"/>
  <rect x="352" y="130" width="320" height="660" rx="120" fill="none" stroke="#4a5f8f" stroke-width="6"/>

  <!-- lamps: all fully inside the housing -->
  <circle cx="512" cy="270" r="76" fill="url(#lampRed)"/>
  <circle cx="512" cy="480" r="76" fill="url(#lampAmber)"/>
  <circle cx="512" cy="690" r="76" fill="url(#lampGreen)"/>

  <!-- lamp highlights -->
  <circle cx="486" cy="246" r="20" fill="#ffffff" opacity="0.35"/>
  <circle cx="486" cy="456" r="20" fill="#ffffff" opacity="0.35"/>
  <circle cx="486" cy="666" r="20" fill="#ffffff" opacity="0.35"/>

  <!-- nozzle -->
  <path d="M462 776 L562 776 L584 830 L440 830 Z" fill="#8899bb"/>

  <!-- exhaust flame: wide base at the nozzle, tapering to a bottom point -->
  <path d="M446 818 C478 804 547 804 578 818 C616 852 614 908 572 948 C550 972 532 984 512 988 C492 984 474 972 452 948 C410 908 408 852 446 818 Z" fill="url(#flame)"/>
  <path d="M486 862 C500 852 526 852 540 862 C556 884 552 908 536 928 C526 942 518 950 512 952 C506 950 498 942 488 928 C472 908 468 884 486 862 Z" fill="#fff7cc" opacity="0.85"/>
</svg>
