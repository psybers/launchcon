name: LaunchCon
options:
  bundleIdPrefix: com.psybers
  createIntermediateGroups: true
targets:
  LaunchCon:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: LaunchCon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.psybers.LaunchCon
        PRODUCT_NAME: LaunchCon
        INFOPLIST_KEY_CFBundleDisplayName: LaunchCon
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        MARKETING_VERSION: "0.1.3"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "5.0"
  LaunchConTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: LaunchConTests
    dependencies:
      - target: LaunchCon
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
